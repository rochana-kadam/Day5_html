<!DOCTYPE html>
<html>
  <head>
    <title>YouTube</title>

    <!-- Connect HTML to CSS -->
    <link rel="stylesheet" href="16a.css">
  </head>

  <body>

    <div class="header">

      <!-- LEFT SECTION -->
      <div class="left-section">
        <!-- Keep your existing left-section code here -->
      </div>


      <!-- MIDDLE SECTION -->
      <div class="middle-section">

        <!-- Search button -->
        <div class="search-button">
          <img class="search-icon" src="search-button.svg">
          <div class="tooltip">Search</div>
        </div>

        <!-- Voice search -->
        <div class="voice-search-button">
          <img
            class="voice-search-icon"
            src="voice.svg"
          >
          <div class="tooltip">Search with your voice</div>
        </div>

      </div>


      <!-- RIGHT SECTION -->
      <div class="right-section">

        <!-- Upload -->
        <div class="upload-icon-container">
          <img
            class="upload-icon"
            src="upload.svg"
          >
          <div class="tooltip">Create</div>
        </div>


        <!-- YouTube Apps -->
        <div class="youtube-apps-icon-container">
          <img
            class="youtube-apps-icon"
            src="youtube.svg"
          >
          <div class="tooltip">YouTube Apps</div>
        </div>


        <!-- Notifications -->
        <div class="notifications-icon-container">
          <img
            class="notifications-icon"
            src="notification.svg"
          >

          <div class="notifications-count">
            3
          </div>

          <div class="tooltip">Notifications</div>
        </div>


        <!-- User picture -->
        <img
          class="current-user-picture"
          src="user-profile.svg"
        >

      </div>

    </div>

  </body>
</html>
